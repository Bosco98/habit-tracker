[package]
name = "habits"
version = "0.1.0"
description = "A local-first, end-to-end encrypted habit tracker"
authors = ["bosco"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "habits_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
